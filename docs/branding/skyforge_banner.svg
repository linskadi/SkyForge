    <circle cx="420" cy="140" r="2.5"/><circle cx="700" cy="90" r="3"/>
    <circle cx="980" cy="150" r="2"/><circle cx="1150" cy="80" r="2.5"/>
    <circle cx="1220" cy="220" r="2"/><circle cx="600" cy="600" r="2.5"/>
    <circle cx="900" cy="620" r="3"/><circle cx="1180" cy="560" r="2"/>
  </g>

  <!-- 徽章 -->
  <rect x="60" y="70" width="380" height="380" rx="96" fill="url(#badge)"/>
  <rect x="76" y="86" width="348" height="348" rx="82" stroke="#7DD3FC" stroke-opacity="0.3" stroke-width="4"/>

  <!-- 徽章内纸飞机 -->
  <g>
    <path d="M140 330 L250 190 L196 302 Z" fill="url(#plane)"/>
    <path d="M196 302 L250 190 L286 372 L244 336 Z" fill="#FFFFFF" fill-opacity="0.92"/>
    <path d="M140 330 L244 336 L196 302 Z" fill="#0A1F44" fill-opacity="0.15"/>
    <path d="M244 336 L286 372 L244 336 Z" fill="#B7E4FF"/>
  </g>
  <path d="M108 356 C150 340 185 340 215 346" stroke="#8FD4FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 14" fill="none"/>

  <!-- 字标 -->
  <text x="620" y="230" font-family="Arial Black, Segoe UI, Arial, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="2">SkyForge</text>
  <text x="628" y="292" font-family="Segoe UI, Arial, sans-serif" font-weight="500" font-size="34" fill="#8FD4FF" letter-spacing="10">天锻 · AI-POWERED AVIATION SOFTWARE</text>

