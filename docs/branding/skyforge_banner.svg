<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08162E"/>
      <stop offset="0.55" stop-color="#0E3A66"/>
      <stop offset="1" stop-color="#1E6FA8"/>
    </linearGradient>
    <linearGradient id="badge" x1="90" y1="60" x2="430" y2="430" gradientUnits="userSpaceOnUse">
